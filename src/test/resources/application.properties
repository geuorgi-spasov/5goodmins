# The signing key the application refuses to start without (SignedTokenProperties).
# Every @SpringBootTest loads the real context, so without a value here the whole
# suite fails on a missing property rather than on anything it meant to test.
#
# .properties rather than .yaml on purpose: a src/test/resources/application.yaml
# would sit in front of src/main/resources/application.yaml on the classpath and
# replace it, taking forward-headers-strategy and the session cookie flags with
# it -- which is precisely what SecurityHeadersTest exists to measure. A
# different extension is loaded in addition, so this adds one key and masks
# nothing.
#
# That this value is here is also why SignedTokenPropertiesTest asserts the
# refusal directly, with a context of its own: the guarantee is not observable
# in a suite that satisfies it.
app.token.secret=test-only-signing-key-at-least-32-characters

# The two mail properties the application refuses to start without
# (EmailProperties). Values that are obviously not real, so that a test asserting
# on a link asserts on something recognisable and a message that somehow escaped
# would be traceable to the suite rather than look like production mail.
#
# spring.mail.host is deliberately NOT set: no JavaMailSender means EmailConfig
# supplies the sender that refuses, so a test that sends email unexpectedly
# fails with an exception instead of opening a socket. No test points at
# Mailpit (ADR-005).
app.mail.from=no-reply@test.invalid
app.mail.from-name=5 Good Minutes (test)
app.mail.base-url=https://test.invalid

# The schema, without db/seed -- the demo content application.yaml loads in
# every real environment (ADR-021).
#
# Not isolation for its own sake: the whole suite shares one PostgreSQL
# container (TestcontainersConfiguration), so the seed's 31 actions and two
# authors would be committed rows that every global assertion has to account
# for -- `actions.count()` in ActionRepositoryTest, `users.count()` in
# RegistrationServiceTest -- and that every future test would have to remember.
# A test asserting "this query returns the two rows I inserted" is worth more
# than a test asserting "33".
#
# This is the override §4 warns about when it rejects conditional Flyway
# locations, and it is safe for exactly the reason that warning does not apply
# here: the failure it describes is a long-lived database that has a migration
# applied and later runs with a configuration that cannot resolve it. Every
# database this file configures is a Testcontainers container that is deleted
# when the JVM exits.
spring.flyway.locations=classpath:db/migration
