# The signing key the application refuses to start without (SignedTokenProperties).
# Every @SpringBootTest loads the real context, so without a value here the whole
# suite fails on a missing property rather than on anything it meant to test.
#
# .properties rather than .yaml on purpose: a src/test/resources/application.yaml
# would sit in front of src/main/resources/application.yaml on the classpath and
# replace it, taking forward-headers-strategy and the session cookie flags with
# it -- which is precisely what SecurityHeadersTest exists to measure. A
# different extension is loaded in addition, so this adds one key and masks
# nothing.
#
# That this value is here is also why SignedTokenPropertiesTest asserts the
# refusal directly, with a context of its own: the guarantee is not observable
# in a suite that satisfies it.
app.token.secret=test-only-signing-key-at-least-32-characters
