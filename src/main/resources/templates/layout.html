<!DOCTYPE html>
<!--/*
  STRUCTURAL PLACEHOLDER, NOT A DESIGN.

  The frontend brief is addressed to a frontend contributor, and the design is
  theirs: section 7 names turquoise as the brand colour and leaves the rest
  open, section 1 requires self-hosted fonts with checked Cyrillic coverage,
  and section 5 lists the fragments worth building once. None of that is here
  and none of it should be decided by the backend.

  What is here is only what the web layer cannot work without: the page
  skeleton, the CSRF meta tags, the htmx wiring, the skip link, the flash
  area and the language switcher's links. There is no layout, no font and
  almost no stylesheet. Replace all of this freely -- what must survive is
  listed in each page's own comment, and for this file it is four things:

    1. The two CSRF meta tags and the hx-headers attribute on <body>. Remove
       any of them and every htmx POST is a silent 403.
    2. The main element keeps id="main", or the skip link points at nothing.
       Every PAGE template's own <main> carries that id too -- th:replace
       below swaps this element for the page's, tag and all, so the id has to
       be on theirs. LayoutWebTest checks one page; the convention is yours
       to keep on the rest.
    3. htmx is loaded from /js, not from a CDN: the Content-Security-Policy
       (ADR-020) allows scripts from this origin only.
    4. Every string comes from the bundles (ADR-008).

  Used as a parameterised fragment rather than through the layout dialect,
  which is not a dependency: a page declares
  <html th:replace="~{layout :: page(#{some.title}, ~{::main})}"> and passes
  its own <main> in.
*/-->
<html th:fragment="page(pageTitle, content)"
      lang="bg" th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!--/*
      The CSRF token, for htmx (frontend brief, section 1). Plain forms need
      none of this -- Thymeleaf's Spring dialect puts a hidden input in any
      th:action form by itself -- so these two lines exist for the fetch-style
      requests htmx makes, and the first page that loads htmx reads them.

      The safe-navigation operator matters: csrf() can be disabled per path and
      the attribute is then absent, which without ?. is an exception on every
      page rather than a missing meta tag.
    */-->
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">

    <title th:text="${pageTitle} + ' - ' + #{app.name}">5 Good Minutes</title>

    <!--/*
      One stylesheet, because there is one page's worth of design so far. If
      the design system wants a file per area, add them here -- or add a
      third fragment parameter for per-page assets, which is the cheaper
      change the day one page needs 40KB nothing else does.
    */-->
    <link rel="stylesheet" th:href="@{/css/main.css}">

    <!--/*
      htmx's own configuration, as markup rather than as a script, because
      the CSP (ADR-020) allows no inline JavaScript. It has to come before
      the script tag: htmx reads this meta tag when it loads.

      allowEval=false turns off the three htmx features that evaluate strings
      as code -- hx-on:* handlers, the js: prefix on hx-vals and hx-headers,
      and event filters like hx-trigger="click[ctrlKey]". All three use the
      Function constructor, which the CSP blocks anyway; the difference is
      that htmx now declines them with a readable console message instead of
      the browser reporting a policy violation from somewhere inside a
      minified file. The replacement for all three is a handler in a file
      under /js.
    */-->
    <meta name="htmx-config" content='{"allowEval": false}'>

    <!--/*
      htmx, vendored at a pinned version under src/main/resources/static/js
      (ADR-020). Not a CDN: the CSP allows this origin only, a third-party
      script tag is a third party who can change the page, and an offline
      laptop should still run the site.

      defer rather than the end of <body>: the parser does not stop for it,
      and htmx processes the document on DOMContentLoaded either way.
    */-->
    <script th:src="@{/js/htmx-2.0.11.min.js}" defer></script>
</head>

<!--/*
  hx-headers puts the CSRF token on every htmx request from this page, which
  is the one line that keeps htmx POSTs from returning 403. Built here rather
  than read from the meta tags by a script, because reading them would need
  inline JavaScript and the CSP forbids it.

  th:attr with a null value writes no attribute at all, which is what the
  conditional expression is for: on a path where CSRF is disabled there is no
  token to write and an empty header would be a lie.
*/-->
<body th:attr="hx-headers=${_csrf != null
                 ? '{&quot;' + _csrf.headerName + '&quot;: &quot;' + _csrf.token + '&quot;}'
                 : null}">

<!--/*
  The skip link: the first focusable thing on the page, for a keyboard or
  screen-reader user who would otherwise tab through the whole header on
  every page. It is not optional under the accessibility line in section 7 of
  the brief, and it is the reason <main> carries an id and tabindex.
*/-->
<a href="#main" th:text="#{layout.skipToContent}">Към основното съдържание</a>

<header>
    <!--/*
      Home does not exist yet (frontend brief, page 1). Until it does, an
      anonymous visitor following this is redirected to the login form by
      anyRequest().authenticated().
    */-->
    <a th:href="@{/}" th:text="#{app.name}">5 Good Minutes</a>

    <!--/*
      The language switcher. The links come from LocaleSwitch rather than from
      an expression here, because Thymeleaf 3.1 removed #request -- see that
      class for why they are paths built server-side rather than a redirect
      back to Referer.

      The language being read is text, not a link: a link to the page you are
      already on does nothing, and aria-current is what tells a screen reader
      which of the two is active.
    */-->
    <nav th:attr="aria-label=#{language.label}">
        <ul>
            <li th:each="language : ${languageLinks}">
                <span th:if="${language.current}"
                      aria-current="page"
                      th:text="#{'language.' + ${language.tag}}">Български</span>
                <a th:unless="${language.current}"
                   th:href="${language.url}"
                   th:attr="hreflang=${language.tag}"
                   th:text="#{'language.' + ${language.tag}}">English</a>
            </li>
        </ul>
    </nav>
</header>

<!--/*
  The flash area, above the page content and outside it, so that a controller
  can say something after a redirect without every page template carrying the
  markup for it. Renders nothing when there is no message.
*/-->
<div th:replace="~{fragments/flash :: flash}"></div>

<main th:replace="${content}">
    <p>The page's own content replaces this.</p>
</main>

</body>
</html>
