<!--/*
  Sent when someone registers an address that already has a confirmed account
  (ADR-005). Not one of the frontend brief's three templates -- it is the
  fourth, and it exists because the registration form must answer identically
  for every address, which leaves the mailbox as the only safe place to say
  anything at all.

  It is deliberately reassuring rather than alarming. The overwhelmingly likely
  reader is the account's own owner, who forgot they had one; treating them as
  the victim of an attack would be both wrong and the thing that makes people
  mistrust a site. "Nothing changed" is the message.

  It offers the login page, not a password reset: reset is v1.1 (frontend brief
  section 10). When that lands, this email is where it is most needed.

  Model: displayName, loginUrl. siteUrl comes from the composer.
*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: page(#{email.existingAccount.subject}, #{email.existingAccount.preheader}, ~{:: #content})}">
<body>
<div id="content"
     style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:16px; line-height:24px;">

    <p class="text" style="margin:16px 0 12px 0; color:#172424;"
       th:text="#{email.existingAccount.greeting(${displayName})}">Hello,</p>

    <p class="text" style="margin:0 0 24px 0; color:#172424;"
       th:text="#{email.existingAccount.intro}">An account already exists for this address.</p>

    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px 0;">
        <tr>
            <td align="center" bgcolor="#0f766e" style="background-color:#0f766e; border-radius:6px;">
                <a th:href="${loginUrl}" th:text="#{email.existingAccount.cta}"
                   style="display:inline-block; padding:14px 28px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:16px; font-weight:700; color:#ffffff; text-decoration:none;">
                    Log in
                </a>
            </td>
        </tr>
    </table>

    <p class="muted" style="margin:0 0 4px 0; font-size:13px; line-height:20px; color:#5c6b6b;"
       th:text="#{email.footer.linkFallback}">If the button does not work:</p>
    <!--/* Three spellings of one instruction, because an unbreakable
           90-character token URL in a fixed 600px table is a horizontal
           scrollbar on a phone, and no single property is widely enough
           supported to prevent it. Measured against Mailpit's compatibility
           check: word-break is unsupported or partial in 34 of 47 clients and
           overflow-wrap -- the current standard -- is worse, at 50%
           unsupported. word-wrap is the legacy Microsoft name Outlook
           understands and caniemail does not test at all. The bet is the union
           of the three, which is weakly better than any one of them.

           Worth knowing before optimising the number: adding these *lowered*
           Mailpit's aggregate score from 86.1% to 85.6%, because that score
           averages over the declarations present rather than over outcomes.
           The behaviour is what matters; where none of the three lands, the
           URL overflows and the button above it still works. */-->
    <p style="margin:0 0 24px 0; font-size:13px; line-height:20px; word-break:break-all; overflow-wrap:break-word; word-wrap:break-word;">
        <a th:href="${loginUrl}" th:text="${loginUrl}" style="color:#0f766e;">https://5goodmins.com/login</a>
    </p>

    <p class="muted" style="margin:0 0 16px 0; font-size:13px; line-height:20px; color:#5c6b6b;"
       th:text="#{email.existingAccount.unchanged}">Nothing in your account has changed.</p>
</div>
</body>
</html>
