<!DOCTYPE html>
<!--/*
  Page 8 of the frontend brief, "check your inbox" state. STRUCTURAL
  PLACEHOLDER -- unstyled on purpose, the design is the frontend
  contributor's.

  WHAT MUST SURVIVE A REDESIGN. This page carries the most load-bearing copy
  in the MVP, and the brief is explicit about three things that are about tone
  rather than layout:

   * This is NOT an error state. Most people find the email and never read
     past the heading.
   * The recovery is NOT behind a disclosure widget or a "having trouble?"
     link. The person who needs it is the person for whom this page has
     already appeared to fail, and they will not go looking. There is no
     resend form and there will not be one (ADR-002) -- registering again
     over an unconfirmed address IS the resend, and this paragraph is the only
     place anybody learns that.
   * The same page, word for word, is what somebody sees after registering an
     address that already has a confirmed account. If this template ever grows
     a branch on the outcome, the registration form becomes a way to discover
     who has an account here.
*/-->
<html th:replace="~{layout :: page(#{verification.notice.title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main id="main" tabindex="-1">

    <h1 th:text="#{verification.notice.heading}">Check your inbox</h1>

    <!--/*
      The address as the user typed it, not as the database normalised it:
      echoing it back is how a typo gets caught, and it leaks nothing, because
      they are the ones who typed it. th:text escapes, so an address with a
      bracket in it is text rather than markup.
    */-->
    <p th:text="#{verification.notice.sent(${registeredEmail})}">
        We have sent a confirmation link.
    </p>

    <!--/*
      The number of days comes from TokenPurpose.EMAIL_VERIFICATION through the
      controller. Typing "7" into this sentence would be the fourth place that
      number lives, and the one nobody would think to change.
    */-->
    <p th:text="#{verification.notice.expiry(${expiryDays})}">The link is valid for 7 days.</p>

    <p th:text="#{verification.notice.spam}">Check your spam folder first.</p>
    <p>
        <span th:text="#{verification.notice.resend}">Register again with the same address.</span>
        <a th:href="@{/register}" th:text="#{verification.notice.resendLink}">Register again</a>
    </p>

</main>
</body>
</html>
