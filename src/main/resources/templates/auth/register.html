<!DOCTYPE html>
<!--/*
  Page 6 of the frontend brief: the registration form. STRUCTURAL PLACEHOLDER.

  Unstyled and unlaid-out on purpose -- the design is the frontend
  contributor's (brief, sections 5 and 7), including the field fragment this
  deliberately does not use.

  WHAT MUST SURVIVE A REDESIGN, because the backend depends on it:

   * th:action, not action. It is what makes Thymeleaf's Spring dialect add
     the hidden CSRF input. Written as action="/register" every submission is
     a 403 with nothing on the page to explain it.
   * The th:field bindings and the th:errors next to each one. The error
     messages come from the bundle through the validator (ValidationConfig).
   * The consent checkbox sits INSIDE its label. Thymeleaf renders a bound
     checkbox as id="privacyAccepted1" -- a checkbox can be one of many
     sharing a name -- so a for="privacyAccepted" written by hand points at
     nothing, and the only symptom is that tapping the consent text does not
     tick the box. Wrapping needs no id at all.
   * novalidate, so that every message a user sees comes from the bundle in
     the language they chose rather than from the browser in the language of
     the operating system.
   * No maxlength on the password. The real ceiling is 72 BYTES, not
     characters -- a Cyrillic letter costs two -- so a maxlength would
     silently truncate a Bulgarian passphrase and leave someone with a
     password they cannot retype. The controller rejects it with a sentence
     that says why.
*/-->
<html th:replace="~{layout :: page(#{register.title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main id="main" tabindex="-1">

    <h1 th:text="#{register.heading}">Create an account</h1>
    <p th:text="#{register.intro}">It takes a minute.</p>

    <form th:action="@{/register}" th:object="${form}" method="post" novalidate>

        <div>
            <label for="email" th:text="#{register.email.label}">Email address</label>
            <input type="email" th:field="*{email}"
                   autocomplete="email" inputmode="email" required
                   th:attr="aria-describedby='email-hint', aria-invalid=${#fields.hasErrors('email')}">
            <p id="email-hint" th:text="#{register.email.hint}">We send a link here.</p>
            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</p>
        </div>

        <div>
            <label for="displayName" th:text="#{register.displayName.label}">Display name</label>
            <input type="text" th:field="*{displayName}"
                   autocomplete="nickname" maxlength="80" required
                   th:attr="aria-describedby='displayName-hint', aria-invalid=${#fields.hasErrors('displayName')}">
            <p id="displayName-hint" th:text="#{register.displayName.hint}">Shown next to your actions.</p>
            <p th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}">Error</p>
        </div>

        <div>
            <label for="password" th:text="#{register.password.label}">Password</label>
            <input type="password" th:field="*{password}"
                   autocomplete="new-password" required
                   th:attr="aria-describedby='password-hint', aria-invalid=${#fields.hasErrors('password')}">
            <p id="password-hint" th:text="#{register.password.hint}">At least 8 characters.</p>
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</p>
        </div>

        <div>
            <label for="passwordConfirmation" th:text="#{register.passwordConfirmation.label}">Repeat the password</label>
            <input type="password" th:field="*{passwordConfirmation}"
                   autocomplete="new-password" required
                   th:attr="aria-invalid=${#fields.hasErrors('passwordConfirmation')}">
            <p th:if="${#fields.hasErrors('passwordConfirmation')}"
               th:errors="*{passwordConfirmation}">Error</p>
        </div>

        <div>
            <!--/*
              The privacy policy is page 5 of the brief and is not built yet,
              so this link currently resolves to the login redirect rather than
              to the document it names. Left as a link because the consent is
              only meaningful if the text is reachable, and because the day
              page 5 lands this is already correct.
            */-->
            <label>
                <input type="checkbox" th:field="*{privacyAccepted}">
                <span>
                    <span th:text="#{register.privacy.before}">I have read and accept the</span>
                    <a th:href="@{/privacy}" th:text="#{register.privacy.link}">privacy policy</a>
                </span>
            </label>
            <p th:if="${#fields.hasErrors('privacyAccepted')}"
               th:errors="*{privacyAccepted}">Error</p>
        </div>

        <button type="submit" th:text="#{register.submit}">Register</button>
    </form>

    <p>
        <span th:text="#{register.haveAccount}">Already have an account?</span>
        <a th:href="@{/login}" th:text="#{register.haveAccountLink}">Log in</a>
    </p>

</main>
</body>
</html>
