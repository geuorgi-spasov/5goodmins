# Bulgarian UI text. The default language (ADR-008); messages_en.properties is
# the translation, not the other way round.
#
# UTF-8, which Spring Boot's MessageSource uses by default. A .properties file
# read as ISO-8859-1 -- the JDK's own default for ResourceBundle, and what
# happens without Boot's MessageSourceProperties -- turns every line below into
# mojibake, so do not "fix" an encoding problem by escaping the Cyrillic.
#
# Keys are namespaced by where they are used: email.<name>.<part>. Segments are
# camelCase rather than hyphenated because a hyphen inside a Thymeleaf #{...}
# expression is read as subtraction.
#
# Nothing here may be an interpolated Java string instead (ADR-008). Arguments
# are {0}, {1} and MessageFormat rules apply: a literal single quote has to be
# doubled, which is the reason none of these sentences uses an apostrophe.

# --- Shared email chrome -----------------------------------------------------
email.brand=5 Good Minutes
email.footer.automated=Това е автоматично съобщение. Моля, не отговаряйте на него.
email.footer.site=5goodmins.com
email.footer.linkFallback=Ако бутонът не работи, отворете този адрес в браузъра си:

# --- "Check your inbox" (frontend brief, page 8) -----------------------------
# The recovery from an email that never arrives, which is the only recovery
# there is: ADR-002 cut the resend form because registering again over an
# unverified row already *is* a resend. That is only true if the page says so,
# which is what these four lines are for.
verification.notice.heading=Проверете пощата си
verification.notice.sent=Изпратихме връзка за потвърждение на {0}.
verification.notice.expiry=Връзката е валидна {0} дни.
verification.notice.spam=Писмото не пристига? Проверете папката със спам - там попада най-често писмо от нов подател.
verification.notice.resend=Ако все още го няма, регистрирайте се отново със същия адрес и ще изпратим нова връзка. Старата спира да работи.
verification.notice.resendLink=Регистрирайте се отново

# --- Email verification (ADR-002) --------------------------------------------
email.verification.subject=Потвърдете имейл адреса си
email.verification.preheader=Остава една стъпка - потвърдете адреса си.
email.verification.greeting=Здравейте, {0},
email.verification.intro=Благодарим ви, че се регистрирахте в 5 Good Minutes. Натиснете бутона по-долу, за да потвърдите, че този имейл адрес е ваш.
email.verification.cta=Потвърждавам адреса си
email.verification.expiry=Връзката е валидна {0} дни. След това трябва да се регистрирате отново.
email.verification.unexpected=Ако не сте се регистрирали в 5goodmins.com, изтрийте този имейл. Без потвърждение профилът се премахва автоматично.

# --- Registration over an address that already has an account (ADR-005) ------
email.existingAccount.subject=Вече имате профил в 5 Good Minutes
email.existingAccount.preheader=Някой опита да се регистрира с вашия адрес.
email.existingAccount.greeting=Здравейте, {0},
email.existingAccount.intro=Някой - вероятно вие - опита да се регистрира в 5goodmins.com с този имейл адрес. Профил с него вече съществува, затова не създадохме нов.
email.existingAccount.cta=Вход в профила
email.existingAccount.unchanged=Нищо в профила ви не е променено и не е нужно да правите нищо.

# --- Layout chrome -----------------------------------------------------------
# app.name is not translated: the product is called 5 Good Minutes in both
# languages, the same way email.brand is.
app.name=5 Good Minutes
layout.skipToContent=Към основното съдържание
language.label=Език
language.bg=Български
language.en=English

# --- Registration form (frontend brief, page 6) ------------------------------
register.title=Регистрация
register.heading=Създайте профил
register.intro=Нужни са ви минута и работещ имейл адрес.
register.email.label=Имейл адрес
register.email.hint=Изпращаме връзка за потвърждение на този адрес. Без нея профилът не се активира.
register.displayName.label=Име за показване
register.displayName.hint=Вижда се до действията, които публикувате. Може да е и псевдоним.
register.password.label=Парола
register.password.hint=Поне 8 знака. Дълга фраза е по-добра от кратка сложна парола.
register.passwordConfirmation.label=Повторете паролата
# Two keys rather than one with a {0}: the second is the link text, and a
# sentence with a link in the middle needs the two halves separately.
register.privacy.before=Прочетох и приемам
register.privacy.link=политиката за поверителност
register.submit=Регистрация
register.haveAccount=Вече имате профил?
register.haveAccountLink=Влезте

# --- Login form (frontend brief, page 7) -------------------------------------
# login.failed is one message for every failure on purpose: wrong password, no
# such address, an unconfirmed account and a disabled one all say this. Naming
# which one would turn the form into an account-enumeration oracle.
login.title=Вход
login.heading=Вход в профила
login.email.label=Имейл адрес
login.password.label=Парола
login.submit=Вход
login.failed=Грешен имейл адрес или парола.
login.loggedOut=Излязохте от профила си.
login.noAccount=Нямате профил?
login.noAccountLink=Регистрирайте се

# --- Verification result states (frontend brief, page 8) ---------------------
# The dead-link state deliberately has no body of its own: it reuses
# verification.notice.resend and .resendLink above, because the recovery from a
# dead link is the same recovery as from an email that never arrived.
verification.notice.title=Проверете пощата си
verification.result.title=Потвърждение на адреса
verification.result.confirmed.heading=Адресът е потвърден
verification.result.confirmed.body=Готово. Вече може да влезете в профила си.
verification.result.alreadyConfirmed.heading=Адресът вече е потвърден
verification.result.alreadyConfirmed.body=Нищо повече не е нужно. Влезте в профила си, когато пожелаете.
verification.result.loginLink=Вход в профила
verification.result.deadLink.heading=Връзката вече не е валидна

# --- Form validation ---------------------------------------------------------
# {min} and {max} are Bean Validation placeholders filled in from the annotation,
# not MessageFormat arguments: the number lives on @Size and is read from there.
validation.email.required=Въведете имейл адрес.
validation.email.format=Това не прилича на имейл адрес.
validation.email.tooLong=Адресът е твърде дълъг.
validation.displayName.required=Въведете име за показване.
validation.displayName.tooLong=Името е твърде дълго - най-много 80 знака.
validation.password.required=Въведете парола.
validation.password.length=Паролата трябва да е между {min} и {max} знака.
validation.password.tooManyBytes=Паролата е твърде дълга. Кирилските букви заемат двойно повече място, затова опитайте с по-кратка фраза.
validation.password.confirmationRequired=Повторете паролата.
validation.password.mismatch=Двете пароли не съвпадат.
validation.privacy.required=Трябва да приемете политиката за поверителност.
