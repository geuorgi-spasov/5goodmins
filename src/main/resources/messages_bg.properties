privacy.heading=Политика за поверителност
privacy.draftNotice=Пълният текст още се подготвя. По-долу е описано какво събираме и защо.
privacy.data.heading=Какви данни събираме
privacy.data.body=При регистрация запазваме имейл адреса ви, името за показване и паролата ви във вид на необратим хеш. Имейл адресът се използва, за да потвърдите профила си и за да получавате дневния бюлетин, ако сте го включили. Не продаваме и не предоставяме данните ви на трети страни.
privacy.rights.heading=Ваши права
privacy.rights.body=Може да изтриете профила си по всяко време - това премахва окончателно и публикуваните от вас действия. Всеки бюлетин съдържа връзка за отписване, която работи без вход в профила.

# --- Taxonomy: the display text for every enum constant (ADR-008) -----------
# The constants are English identifiers in the code and in the database
# (ActionType, Category, Region, ActionStatus); these lines are the only place
# a human-readable form of them exists. A template renders one with
# #{'category.' + ${category}} -- the key is built from the enum name, which
# is why the segment after the dot is UPPER_SNAKE here and camelCase nowhere.
#
# TaxonomyMessagesTest walks the four enums and fails if a constant has no key
# in either bundle. That matters more than it looks: with locale fallback off
# (MessageSourceConfig), a missing key is a NoSuchMessageException, so a new
# region added without a label is a 500 on every page that lists regions.

action.type.PETITION=Петиция
action.type.LETTER_OR_EMAIL=Писмо или имейл
