# The host assigns the port at runtime and expects the process to bind it; 8080
# locally.
server:
  port: ${PORT:8080}

  # Cloudflare (proxied, Full strict) terminates TLS at the edge and forwards
  # plain HTTP to Railway, so without this every request Tomcat sees is HTTP
  # from a private address. Two measured consequences on the live site:
  # Spring Security omitted Strict-Transport-Security entirely -- it writes the
  # header only when request.isSecure() -- and Tomcat did not mark the session
  # cookie Secure. `native` makes Tomcat's own RemoteIpValve read
  # X-Forwarded-Proto, X-Forwarded-For and X-Forwarded-Host and present the
  # request as what the browser actually made, which fixes both at the source
  # rather than overriding the header conditions downstream. It also restores
  # the real client IP, which the rate limiting on /login and /register
  # (ADR-002) will need in order to bucket by anything other than the proxy.
  #
  # `native` rather than `framework`: RemoteIpValve only honours the forwarded
  # headers when the immediate peer is in its internalProxies allowlist, so a
  # header arriving straight from a client is ignored. ForwardedHeaderFilter,
  # which `framework` installs, trusts X-Forwarded-Proto unconditionally -- and
  # anything that can reach the origin directly could then claim HTTPS and
  # forge its own client IP.
  #
  # That allowlist defaults to every private range, not just the IPv4 ones:
  # 10/8, 172.16/12, 192.168/16, 169.254/16, 100.64/10 (carrier-grade NAT),
  # 127/8, ::1/128, fe80::/10 and fc00::/7 (IPv6 unique-local). Tomcat 11 takes
  # CIDR here rather than the IPv4-only regex of earlier versions, which is
  # what most writing on this property still describes. Railway's proxy
  # therefore almost certainly lands inside it.
  #
  # Still unverified on the live site. The HSTS half is one curl -- against the
  # *.up.railway.app domain, not 5goodmins.com, because Cloudflare can be
  # configured to add Strict-Transport-Security itself and would mask the
  # answer. Measured 2026-10-28: it is not adding it -- Cloudflare's own 502
  # error page, which it generates end to end, carries no HSTS -- so whatever
  # the origin emits is what a browser gets. If HSTS is missing there, the fix is
  # server.tomcat.remoteip.internal-proxies scoped to the address that shows up
  # in the access log, never `.*` and never a switch to `framework` -- and note
  # that setting that property REPLACES the default list above rather than
  # extending it, so whatever Railway's hop needs has to be in the new value.
  #
  # The other half -- whether Railway's proxy appends to X-Forwarded-For or
  # passes it through -- no curl can answer, because nothing reported the
  # resolved address back. Something does now: RateLimitFilter logs the bucket
  # key next to the raw remote address on every refusal, so twenty-one POSTs to
  # /login print what the valve resolved. ADR-002 carries the reading.
  forward-headers-strategy: native

  tomcat:
    remoteip:
      # Cloudflare's published edge ranges, so RemoteIpValve walks *past* the
      # edge and lands on the real client (ADR-002, "the bucket key"). Without
      # this the walk stops at the first entry matching neither proxy list --
      # which is Cloudflare's public edge address -- and every request on the
      # site shares one rate-limiting bucket, putting the whole country behind
      # one /login limit.
      #
      # trusted-proxies, NOT internal-proxies. Boot gives internal-proxies a
      # default value (the private ranges, 10/8 included), and setting that
      # property REPLACES the default rather than extending it -- so the
      # obvious-looking fix would stop trusting the hop Railway's own proxy
      # arrives on, which is the hop this whole mechanism depends on.
      # trusted-proxies is empty by default and therefore adds.
      #
      # Tomcat 11 accepts CIDR here as well as the IPv4-only regex that older
      # writing on this property describes; Boot's own internal-proxies default
      # is a CIDR list, which is the proof it goes through the same setter.
      #
      # Fetched from https://www.cloudflare.com/ips-v4 and /ips-v6 on
      # 2026-10-29. This list changes rarely and with notice, and a stale copy
      # fails in the safe direction: the walk stops at the edge again and the
      # limit becomes global rather than absent. Over-restrictive is the right
      # way for a limiter to break, which is why this is a committed list and
      # not a startup fetch -- a fetch would add a boot-time dependency on
      # Cloudflare's API for a file that changes once a year.
      trusted-proxies: >-
        173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22,
        141.101.64.0/18, 108.162.192.0/18, 190.93.240.0/20, 188.114.96.0/20,
        197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13,
        104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22,
        2400:cb00::/32, 2606:4700::/32, 2803:f800::/32, 2405:b500::/32,
        2405:8100::/32, 2a06:98c0::/29, 2c0f:f248::/32

  # Production values for the session cookie; application-dev.yaml relaxes
  # `secure`. These close the second half of the finding above: JSESSIONID was
  # going out over the live site with neither flag.
  #
  # secure -- never sent over plain HTTP. forward-headers-strategy already
  # earns the flag for a proxied request; stating it means the session cookie
  # cannot leak over HTTP even if that header is ever missing, or a future host
  # terminates TLS somewhere else. The cost is a plain-HTTP origin, which is
  # why the dev profile turns it off: Chrome and Firefox treat
  # http://localhost as a secure context and would keep the cookie, Safari
  # does not.
  #
  # same-site lax, not strict. Strict withholds the cookie on every cross-site
  # navigation, and the email verification link, the unsubscribe link and every
  # link in the daily digest are exactly that (ADR-005) -- under strict a
  # logged-in user following one arrives logged out. Lax still withholds it on
  # cross-site POSTs, which is the half that is worth having behind the CSRF
  # token.
  #
  # http-only is absent because it is already Tomcat's default for the session
  # cookie. These two are not.
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax

spring:
  application:
    name: fivegoodmins

  # No datasource here on purpose. A committed localhost default made a missing
  # SPRING_DATASOURCE_URL in production look like a dead database -- "Connection
  # to localhost:5432 refused" names the wrong problem, and cost two deploys to
  # diagnose. With nothing here, the same mistake fails at startup with
  # "Failed to configure a DataSource: 'url' attribute is not specified", which
  # names the actual one.
  #
  # Production supplies SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD as
  # environment variables. Local runs get them from application-dev.yaml, which
  # spring-boot:run activates via the plugin's <profiles> configuration.
  # Repository tests get them from Testcontainers' @ServiceConnection.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  # No spring.messages.* here: shared/MessageSourceConfig declares the
  # MessageSource itself, which makes Boot's auto-configuration back off and
  # these properties inert. See that class for why it has to.

  task:
    execution:
      # `force` keeps Boot's applicationTaskExecutor even though this
      # application defines an Executor of its own (EmailConfig's mail pool,
      # ADR-005). Without it, TaskExecutionAutoConfiguration backs off -- its
      # condition is @ConditionalOnMissingBean(Executor.class) -- and the mail
      # pool silently becomes the default for Spring MVC's async request
      # handling. That is the opposite of giving email a pool of its own: a
      # single thread behind a fifty-deep queue, sized for one SMTP call at a
      # time, would be serving the web layer.
      mode: force

# app.token.secret is deliberately absent, for the same reason the datasource
# above is: a committed default would be a published signing key, and every
# email verification and unsubscribe link in production would be forgeable by
# anyone who can read this file -- silently, because nothing about a forged
# token looks wrong. With nothing here, startup fails naming the property.
#
# Production supplies APP_TOKEN_SECRET. Local runs get it from
# application-dev.yaml, tests from src/test/resources/application.properties.
# See SignedTokenProperties for the key's requirements and what rotating it
# costs.

# app.mail.from and app.mail.base-url are absent for the same reason, and the
# same reason again: a committed default would be a plausible wrong value that
# fails days later in someone's inbox rather than at startup. Mail from an
# address this domain is not authorised to send for goes to spam and damages the
# reputation every later digest depends on, and a base-url left at localhost
# puts a dead link in a real mailbox.
#
# Production supplies APP_MAIL_FROM and APP_MAIL_BASE_URL (and optionally
# APP_MAIL_FROM_NAME). Local runs get them from application-dev.yaml, tests from
# src/test/resources/application.properties. See EmailProperties.
#
# app.mail.brevo.api-key is absent for the third time for the same reason, and
# this one is a credential rather than a plausible wrong value: a committed
# Brevo key is a stranger's ability to send mail as this domain. Production
# supplies APP_MAIL_BREVO_API_KEY; the provider was chosen in week 7 on
# free-tier limits (300/day, ADR-005) and the choice touches one class.
#
# spring.mail.* is absent too, and that one is genuinely optional: it exists
# for Mailpit in development. EmailConfig picks Brevo when an API key is set,
# SMTP when a mail host is, and a sender that refuses loudly when neither is --
# so a deploy with no key still starts and still serves every page that does
# not send email, and says so rather than discarding silently.
