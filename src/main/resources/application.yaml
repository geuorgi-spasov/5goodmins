# The host assigns the port at runtime and expects the process to bind it; 8080
# locally.
server:
  port: ${PORT:8080}

  # Cloudflare (proxied, Full strict) terminates TLS at the edge and forwards
  # plain HTTP to Railway, so without this every request Tomcat sees is HTTP
  # from a private address. Two measured consequences on the live site:
  # Spring Security omitted Strict-Transport-Security entirely -- it writes the
  # header only when request.isSecure() -- and Tomcat did not mark the session
  # cookie Secure. `native` makes Tomcat's own RemoteIpValve read
  # X-Forwarded-Proto, X-Forwarded-For and X-Forwarded-Host and present the
  # request as what the browser actually made, which fixes both at the source
  # rather than overriding the header conditions downstream. It also restores
  # the real client IP, which the rate limiting on /login and /register
  # (ADR-002) will need in order to bucket by anything other than the proxy.
  #
  # `native` rather than `framework`: RemoteIpValve only honours the forwarded
  # headers when the immediate peer is in its internalProxies allowlist, so a
  # header arriving straight from a client is ignored. ForwardedHeaderFilter,
  # which `framework` installs, trusts X-Forwarded-Proto unconditionally -- and
  # anything that can reach the origin directly could then claim HTTPS and
  # forge its own client IP.
  #
  # That allowlist defaults to every private range, not just the IPv4 ones:
  # 10/8, 172.16/12, 192.168/16, 169.254/16, 100.64/10 (carrier-grade NAT),
  # 127/8, ::1/128, fe80::/10 and fc00::/7 (IPv6 unique-local). Tomcat 11 takes
  # CIDR here rather than the IPv4-only regex of earlier versions, which is
  # what most writing on this property still describes. Railway's proxy
  # therefore almost certainly lands inside it.
  #
  # Measured on the live site, 2026-10-15 17:29Z, after the deploy that added
  # this line. Railway's proxy does land inside the default internalProxies
  # allowlist, so no server.tomcat.remoteip.internal-proxies narrowing was
  # needed:
  #
  #   HTTP/2 302
  #   location: https://5goodmins.com/login
  #   set-cookie: JSESSIONID=...; Path=/; Secure; HttpOnly; SameSite=Lax
  #   strict-transport-security: max-age=31536000 ; includeSubDomains
  #
  # Against 5goodmins.com rather than the *.up.railway.app domain, which is
  # what an earlier version of this comment called for on the grounds that
  # Cloudflare could be adding Strict-Transport-Security itself and would mask
  # the answer. It cannot be, here: the pre-deploy baseline at 16:46Z returned
  # no strict-transport-security at all through the same Cloudflare edge, which
  # proves edge HSTS is off and leaves Tomcat as the only thing that could have
  # produced the header afterwards. (The *.up.railway.app domain is in any case
  # not attached to this service -- it answers a Railway edge 404 with
  # x-railway-fallback: true.)
  #
  # Three things the baseline got wrong and this fixes, all in one line: the
  # redirect is https rather than http, the session cookie carries Secure, and
  # HSTS is present. The same response also shows the 401 with
  # www-authenticate: Basic gone, which is SecurityConfig's chain having
  # replaced Boot's auto-configured one.
  #
  # If a future host breaks this, the fix is still
  # server.tomcat.remoteip.internal-proxies scoped to the real peer address --
  # never `.*`, and never a switch to `framework`.
  forward-headers-strategy: native

  # Production values for the session cookie; application-dev.yaml relaxes
  # `secure`. These close the second half of the finding above: JSESSIONID was
  # going out over the live site with neither flag, and now goes out with
  # `Secure; HttpOnly; SameSite=Lax` (measured, same request as above).
  #
  # secure -- never sent over plain HTTP. forward-headers-strategy already
  # earns the flag for a proxied request; stating it means the session cookie
  # cannot leak over HTTP even if that header is ever missing, or a future host
  # terminates TLS somewhere else. The cost is a plain-HTTP origin, which is
  # why the dev profile turns it off: Chrome and Firefox treat
  # http://localhost as a secure context and would keep the cookie, Safari
  # does not.
  #
  # same-site lax, not strict. Strict withholds the cookie on every cross-site
  # navigation, and the email verification link, the unsubscribe link and every
  # link in the daily digest are exactly that (ADR-005) -- under strict a
  # logged-in user following one arrives logged out. Lax still withholds it on
  # cross-site POSTs, which is the half that is worth having behind the CSRF
  # token.
  #
  # http-only is absent because it is already Tomcat's default for the session
  # cookie. These two are not.
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax

spring:
  application:
    name: fivegoodmins

  # No datasource here on purpose. A committed localhost default made a missing
  # SPRING_DATASOURCE_URL in production look like a dead database -- "Connection
  # to localhost:5432 refused" names the wrong problem, and cost two deploys to
  # diagnose. With nothing here, the same mistake fails at startup with
  # "Failed to configure a DataSource: 'url' attribute is not specified", which
  # names the actual one.
  #
  # Production supplies SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD as
  # environment variables. Local runs get them from application-dev.yaml, which
  # spring-boot:run activates via the plugin's <profiles> configuration.
  # Repository tests get them from Testcontainers' @ServiceConnection.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

# app.token.secret is deliberately absent, for the same reason the datasource
# above is: a committed default would be a published signing key, and every
# email verification and unsubscribe link in production would be forgeable by
# anyone who can read this file -- silently, because nothing about a forged
# token looks wrong. With nothing here, startup fails naming the property.
#
# Production supplies APP_TOKEN_SECRET. Local runs get it from
# application-dev.yaml, tests from src/test/resources/application.properties.
# See SignedTokenProperties for the key's requirements and what rotating it
# costs.
