# --- Form validation ---------------------------------------------------------
validation.email.required=Enter an email address.
validation.email.format=That does not look like an email address.
validation.email.tooLong=That address is too long.
validation.displayName.required=Enter a display name.
validation.displayName.tooLong=That name is too long - 80 characters at most.
validation.password.required=Enter a password.
validation.password.tooShort=The password must be at least {min} characters.
validation.password.tooManyBytes=That password is too long. Cyrillic letters take twice the space, so try a shorter phrase.
