# --- Privacy policy (frontend brief, page 5) ---------------------------------
privacy.title=Privacy policy
privacy.heading=Privacy policy
privacy.draftNotice=The full text is still being prepared. What we collect and why is described below.
privacy.data.heading=What we collect
privacy.data.body=When you register we store your email address, your display name and your password as an irreversible hash. The email address is used to confirm your account and to send the daily digest if you have turned it on. We do not sell your data or pass it to third parties.
privacy.rights.heading=Your rights
privacy.rights.body=You can delete your account at any time - this also permanently removes the actions you have published. Every digest carries an unsubscribe link that works without logging in.
