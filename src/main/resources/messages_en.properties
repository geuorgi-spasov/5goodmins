# English UI text. The translation; messages_bg.properties is the default
# language (ADR-008). Demo the site in English and the content stays Cyrillic,
# which is the point: this is a Bulgarian product with an English interface
# available, not a bilingual one.
#
# Every key here must exist in messages_bg.properties and vice versa. There is
# no messages.properties to fall back to, deliberately -- see
# spring.messages.fallback-to-system-locale in application.yaml.

# --- Shared email chrome -----------------------------------------------------
email.brand=5 Good Minutes
email.footer.automated=This is an automated message. Please do not reply to it.
email.footer.site=5goodmins.com
email.footer.linkFallback=If the button does not work, open this address in your browser:

# --- "Check your inbox" (frontend brief, page 8) -----------------------------
verification.notice.heading=Check your inbox
verification.notice.sent=We have sent a confirmation link to {0}.
verification.notice.expiry=The link is valid for {0} days.
verification.notice.spam=Nothing arrived? Check your spam folder first - that is where mail from a new sender usually lands.
verification.notice.resend=If it is still missing, register again with the same address and we will send a fresh link. The old one stops working.
verification.notice.resendLink=Register again

# --- Email verification (ADR-002) --------------------------------------------
email.verification.subject=Confirm your email address
email.verification.preheader=One step left - confirm your address.
email.verification.greeting=Hello {0},
email.verification.intro=Thank you for registering with 5 Good Minutes. Press the button below to confirm that this email address is yours.
email.verification.cta=Confirm my address
email.verification.expiry=The link is valid for {0} days. After that you will need to register again.
email.verification.unexpected=If you did not register at 5goodmins.com, delete this email. Without confirmation the account is removed automatically.

# --- Registration over an address that already has an account (ADR-005) ------
email.existingAccount.subject=You already have a 5 Good Minutes account
email.existingAccount.preheader=Someone tried to register with your address.
email.existingAccount.greeting=Hello {0},
email.existingAccount.intro=Someone - probably you - tried to register at 5goodmins.com with this email address. An account already exists for it, so we did not create a new one.
email.existingAccount.cta=Log in
email.existingAccount.unchanged=Nothing in your account has changed and there is nothing you need to do.

# --- Welcome, sent the moment an address is confirmed (ADR-005) -------------
email.welcome.subject=Welcome to 5 Good Minutes
email.welcome.preheader=Your address is confirmed. Here is where to start.
email.welcome.greeting=Hello {0},
email.welcome.intro=Your address is confirmed and your account is active. Thank you for being here.
email.welcome.newest=The newest actions right now
email.welcome.empty=There are no active actions at the moment. Do come back soon - new ones arrive every week.
email.welcome.cta=See all actions

