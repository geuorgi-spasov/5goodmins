# Local development only. Activated by spring-boot:run through the Maven
# plugin's <profiles> configuration, so it is never active in a container: the
# packaged jar starts with no profile and must be given its datasource by the
# environment.
#
# Matches the credentials in compose.yaml.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fivegoodmins
    username: app
    password: app
  # Mailpit, from compose.yaml: SMTP on 1025, its web interface on 8025.
  # Setting a host is what makes Boot create a JavaMailSender, which is in turn
  # what makes EmailConfig choose the SMTP sender over the one that refuses --
  # so this single line is the difference between a dev run that delivers mail
  # and one that logs a failure. Nothing to authenticate against: Mailpit
  # accepts everything and delivers nowhere.
  #
  # Note which way the tie breaks: EmailConfig prefers Brevo when an API key is
  # set, because this host is set for everyone by this file and is therefore not
  # evidence of an intention, while a key is only ever there because somebody
  # put it there. So exporting APP_MAIL_BREVO_API_KEY for a local run sends real
  # mail from the real domain, past Mailpit -- which is occasionally what you
  # want and is never what you want by accident.
  mail:
    host: localhost
    port: 1025

  # Templates reloaded on save, so an email can be edited and re-sent without a
  # restart. Applies to both halves of each email -- the text resolver in
  # EmailConfig reads this same property.
  thymeleaf:
    cache: false

# A local run is plain HTTP on localhost, and a Secure cookie is not sent over
# it by every browser -- Safari refuses, so the session silently never sticks.
# Off here, true in application.yaml, which is the deployed default.
server:
  servlet:
    session:
      cookie:
        secure: false

# A fixed local signing key, so that a restart does not invalidate the
# verification link sitting in Mailpit (ADR-005). Local-only and worth nothing:
# the production key comes from APP_TOKEN_SECRET and is never in the repository.
app:
  token:
    secret: dev-only-signing-key-not-used-anywhere-else-32+

  # From an address nobody owns, deliberately: Mailpit delivers nowhere, so a
  # real address here would only be a real address to typo into production.
  # base-url is localhost so the emailed link opens the local app.
  mail:
    from: no-reply@localhost
    from-name: 5 Good Minutes (dev)
    base-url: http://localhost:8080
