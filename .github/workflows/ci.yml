name: CI

# push on main + pull_request, and no branch filter on the PR trigger. A push
# to a feature branch does not match, so a pull request from this repository
# runs the workflow once rather than twice.
on:
  push:
    branches: [main]
  pull_request:

# Superseded runs are pointless: a second push to the same branch cancels the
# first instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. The default token can write to the repository; nothing here
# needs to, so it reads only.
permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    # A hung Testcontainers start would otherwise sit there for six hours.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          # Caches ~/.m2 keyed on the POM. Takes the run from minutes to under
          # one, and unlike the Dockerfile's BuildKit cache mount it really
          # does persist between runs, because GitHub stores it for us.
          cache: maven

      # ADR-019, enforced rather than asserted. The rule is violated by
      # addition, not by editing: nobody breaks it in a file that already
      # takes a Clock, they break it in a new class written months from now
      # with one Instant.now() in it, which review is bad at catching.
      #
      # A grep rather than ArchUnit. ArchUnit would express this and the
      # package-dependency rules properly, but its JUnit integration is built
      # against JUnit Platform 1.x and this project is on JUnit 6 -- an
      # unverified compatibility question in exchange for a rule two lines of
      # shell already enforce. When the package rules need enforcing too, that
      # is the moment to pay for the dependency.
      #
      # Runs before the build, because it takes a second and a failure here is
      # worth reporting without waiting for Testcontainers.
      #
      # The two filters are not optional: the rule is *discussed* in Javadoc
      # in three places, so without them this fails on its own documentation.
      # The first drops lines whose content begins with * or //, the second
      # drops inline {@code Instant.now()}.
      - name: No Instant.now() outside the injected Clock (ADR-019)
        run: |
          if grep -rnE '(Instant|LocalDate|LocalDateTime|ZonedDateTime|OffsetDateTime)\.now\(\)|System\.currentTimeMillis\(\)' \
                  --include='*.java' src/main/java \
               | grep -vE ':[0-9]+:[[:space:]]*(\*|//)' \
               | grep -v '{@code'; then
            echo "::error::ADR-019: time comes from the injected Clock bean, not a no-arg now(). Take an Instant or a Clock as a parameter."
            exit 1
          fi

      # The whole suite, including the repository tests. ubuntu-latest has a
      # working Docker daemon, so Testcontainers starts its own PostgreSQL and
      # no `services:` block is needed. This is the quality gate the Dockerfile
      # skips tests in favour of.
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress clean verify

      # Only on failure, and only the reports: enough to see which assertion
      # broke without downloading the build output.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Deliberately a separate job, running in parallel: a broken Dockerfile
    # should fail the pull request on its own merits, and it is the only check
    # the deployment depends on. It rebuilds the jar inside the image rather
    # than reusing the one above, which is the honest way to test the file
    # Railway will actually use.
    steps:
      - uses: actions/checkout@v5

      # Plain docker build rather than docker/build-push-action: Docker on the
      # runner is recent enough that BuildKit is the default, so the syntax
      # directive and the cache mounts work with no extra action to pin or
      # explain. The cost is no layer cache between runs -- acceptable for a
      # sanity check, and the dependency download would not be cached anyway,
      # because the cache mount keeps those jars out of the image layers.
      - name: Build image
        run: docker build -t fivegoodmins:${{ github.sha }} .
